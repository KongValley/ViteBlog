# ============================================================
#  ViteBlog 站点配置文件
#  改完保存即可:本地开发自动热更新;push 到 GitHub 后自动重新部署
#  注意:YAML 里冒号后面要有一个空格,值里有冒号时给整个值加引号
# ============================================================

# 博客名称(顶部 logo、首页大标题)
name: ViteBlog

# 主题(决定生成网页的整体风格,十选一):
#   pixel     红白机像素风(游戏机名片、CRT 扫描线)
#   swiss     瑞士网格风(强对比黑白、12 栏网格参考线、红色方点)
#   editorial 现代编辑排版风(衬线大标题、纸感底色、杂志式排版)
#   brutalist 新粗野主义(粗黑边框、实心偏移阴影、高饱和撞色)
#   bento     Bento 便当格(圆角卡片矩阵、暗亮双模式)
#   terminal  终端 CLI(命令提示符、git log 列表、vim 状态栏)
#   glass     玻璃拟态(毛玻璃卡片、渐变光斑背景)
#   ma        日式极简「间」(和纸底、明朝体、竖排落款、朱印)
#   blueprint 工程蓝图(坐标网格、尺寸标注、等距线框、图签栏)
#   noir      暗夜霓虹(纯黑底、品红霓虹描边、招牌闪烁)
# 改完保存:本地开发自动热更新;push 到 GitHub 后自动重新部署
theme: pixel

# 一句话简介(首页标题下方 + 页脚显示)
tagline: 记录学习与生活

# 你的名字(游戏机名片、页脚版权)
author: KongZhipeng

# 建站年份(页脚版权 © 后面的数字)
since: 2026

# 你的 GitHub 用户名(游戏机名片、头像、主页链接都用它)
githubUser: KongValley

# GitHub 仓库地址(页脚链接);不填则默认用 githubUser 拼接
github: https://github.com/KongValley/ViteBlog

# 头像图片地址;不填则默认用 GitHub 头像
# 用本地图片:把文件放进 public/ 目录,这里填 "/文件名"(开头的 / 会自动补全站点子路径)
avatar: /avatar.jpeg

# ============================================================
#  「关于本站」页的联系卡片
#  social 里填了几个就显示几个胶囊;
#  GitHub 会自动用上面的 githubUser 补上(不用在这里重复填)
# ============================================================

# 社交账号:按顺序显示成一排胶囊;name 和 url 必填,handle 可省
social:
  - name: Bilibili
    handle: Choooiiiiii
    url: https://space.bilibili.com/26600138

# ============================================================
#  友链(/links 页面)
#  name 与 url 必填,avatar(头像图片地址)与 desc(一句话介绍)可省;
#  留空(保持 friends: [])时,/links 页面显示一句空态提示,不会报错
# ============================================================

friends: []
#  - name: 示例博客
#    url: https://example.com/
#    avatar: /avatar.jpeg   # 可省;以 / 开头取 public/ 下的文件,也可直接填外链
#    desc: 一句话介绍这个站 # 可省;不填则卡片只显示名称

# ============================================================
#  全站音乐挂件(贴边播放器:固定在左下角,可收成封面方块)
#  QQ 音乐 / 网易云等,走 Meting 接口;填了 id 才显示,整段删掉则不出现挂件
# ============================================================

music:
  # 平台:tencent(QQ音乐)/ netease(网易云)/ kugou / kuwo / baidu
  server: tencent
  # 类型:song(单曲)/ playlist(歌单)
  #   song     → id 填歌曲 id:QQ 音乐歌曲页 https://y.qq.com/n/ryqq_v2/songDetail/003qYzA508Z2yF
  #              里 songDetail/ 后面那串
  #   playlist → id 填歌单 id:QQ 音乐歌单页 https://y.qq.com/n/ryqq/playlist/3011946123
  #              里 playlist/ 后面那串(播放器会出现一个列表按钮,点开是歌单)
  #              注意:QQ 音乐大部分歌要会员/版权限制,代理拿不到播放地址;网易云的歌单基本都能播
  type: playlist
  id: 9781557735
  # Meting 接口地址,:server / :type / :id 三个占位符必须保留,会被自动替换
  # 公共实例偶尔会挂;想稳一点可以按 https://github.com/metowolf/Meting-API 自建后改这里
  api: https://api.injahow.cn/meting/?server=:server&type=:type&id=:id

# ============================================================
#  访问统计(三样都留空 = 完全不加载任何统计脚本,默认如此)
#  GoatCounter:轻量、无 cookie,填站点代码(https://<代码>.goatcounter.com 里的那段)
#  自建 Umami:填脚本地址与网站 ID
# ============================================================

analytics:
  goatcounter: ''
  umamiSrc: ''
  umamiId: ''
