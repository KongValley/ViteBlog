name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署,新推送会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 完整历史:文章排序依赖每个文件的首次提交时间

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 以下三项都很便宜,放在构建前面:格式 / 单测 / 内容问题在最快的地方暴露
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Content check(死链 / 标题层级 / frontmatter)
        run: npm run check

      - name: Theme contract
        run: npm run check:themes

      - name: Build
        run: npm run build

      # 主题隔离自检:当前 dist 只含选中主题的样式,没混进别的主题
      - name: Theme isolation
        run: node design-preview/check-isolation.mjs

      # 构建产物自检:head 标签齐全、本地资源都存在、产物数量对得上
      - name: Dist check
        run: npm run check:dist

      # 真站点冒烟:无头 Chrome 打开首页/文章页/标签页/友链页,查渲染与控制台报错
      - name: Smoke test
        run: npm run smoke -- --shots

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-shots
          path: design-preview/shots
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
